<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chat – Mugiwara No ZK</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, browserLocalPersistence, setPersistence, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getDatabase, ref, push, onValue, remove, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDHk3XnRUJEjt6PlTGIYbCi7ej2QHBRKRY",
    authDomain: "mugiwara-zk.firebaseapp.com",
    databaseURL: "https://mugiwara-zk-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "mugiwara-zk",
    storageBucket: "mugiwara-zk.firebasestorage.app",
    messagingSenderId: "519887598278",
    appId: "1:519887598278:web:1db2e7d49a24f7c0e7cbce"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  await setPersistence(auth, browserLocalPersistence);
  const db = getDatabase(app);

  window._fb = { auth, db, ref, push, onValue, remove, get, signOut, onAuthStateChanged };
</script>

<style>
:root {
  --bg-0: #0d0e11;
  --bg-1: #13151a;
  --bg-2: #1a1d24;
  --bg-3: #22262f;
  --bg-4: #2c3040;
  --border: rgba(255,255,255,0.06);
  --accent: #f5a623;
  --accent2: #ff6b35;
  --text-1: #f0f1f5;
  --text-2: #9da3b4;
  --text-3: #5c6275;
  --green: #23c55e;
  --red: #f04347;
  --radius: 12px;
  --radius-lg: 20px;
  --font-h: 'Syne', sans-serif;
  --font-b: 'DM Sans', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }

body {
  background: var(--bg-0);
  color: var(--text-1);
  font-family: var(--font-b);
  display: flex;
  flex-direction: column;
}

/* ── TOP BAR ── */
.chat-topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 20px;
  background: var(--bg-1);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  position: sticky;
  top: 0;
  z-index: 10;
}
.chat-topbar-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-h);
  font-weight: 800;
  font-size: 1rem;
  text-decoration: none;
  color: var(--text-1);
}
.chat-topbar-brand span { font-size: 1.2rem; }
.topbar-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 12px;
}
.online-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.78rem;
  color: var(--text-2);
  background: var(--bg-3);
  padding: 5px 12px;
  border-radius: 999px;
}
.status-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 6px var(--green);
}
#topbar-pseudo {
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--text-2);
}

/* ── MESSAGES AREA ── */
.chat-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.chat-body::-webkit-scrollbar { width: 4px; }
.chat-body::-webkit-scrollbar-track { background: transparent; }
.chat-body::-webkit-scrollbar-thumb { background: var(--bg-4); border-radius: 4px; }

/* Date separator */
.date-sep {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 12px 0 6px;
  color: var(--text-3);
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.date-sep::before, .date-sep::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* Message groups */
.msg-group { margin-bottom: 4px; }
.msg-group.msg-own { align-items: flex-end; }

.msg-header {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 3px;
  padding-left: 44px;
}
.msg-own .msg-header {
  flex-direction: row-reverse;
  padding-left: 0;
  padding-right: 44px;
}
.msg-author {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--accent);
}
.msg-author.is-admin { color: #7c83ff; }
.msg-time { font-size: 0.68rem; color: var(--text-3); }

.msg-row {
  display: flex;
  align-items: flex-end;
  gap: 10px;
}
.msg-own .msg-row { flex-direction: row-reverse; }

.msg-avatar {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: flex; align-items: center; justify-content: center;
  font-size: 0.78rem;
  font-weight: 700;
  flex-shrink: 0;
  align-self: flex-start;
  margin-top: 2px;
  color: white;
}
.msg-avatar.admin-av {
  background: linear-gradient(135deg, #7c83ff, #5865f2);
}

.msg-bubble {
  background: var(--bg-3);
  padding: 8px 14px;
  border-radius: 4px 18px 18px 4px;
  font-size: 0.92rem;
  line-height: 1.55;
  max-width: min(75%, 520px);
  word-break: break-word;
  position: relative;
  transition: background 0.15s;
}
.msg-bubble:hover { background: var(--bg-4); }
.msg-group:not(.msg-own) .msg-row:first-of-type .msg-bubble { border-radius: 18px 18px 18px 4px; }
.msg-group:not(.msg-own) .msg-row:last-of-type  .msg-bubble { border-radius: 4px 18px 18px 18px; }
.msg-group:not(.msg-own) .msg-row:only-of-type  .msg-bubble { border-radius: 18px; }

.msg-own .msg-bubble {
  background: linear-gradient(135deg, rgba(245,166,35,0.18), rgba(255,107,53,0.12));
  border: 1px solid rgba(245,166,35,0.15);
  border-radius: 18px 4px 4px 18px;
}
.msg-own .msg-row:first-of-type .msg-bubble { border-radius: 18px 18px 4px 18px; }
.msg-own .msg-row:last-of-type  .msg-bubble { border-radius: 18px 4px 18px 18px; }
.msg-own .msg-row:only-of-type  .msg-bubble { border-radius: 18px; }

/* Image in bubble */
.msg-img {
  max-width: 260px;
  max-height: 200px;
  border-radius: 10px;
  object-fit: cover;
  cursor: pointer;
  display: block;
  transition: opacity 0.2s;
}
.msg-img:hover { opacity: 0.88; }

/* Delete btn */
.del-btn {
  display: none;
  background: rgba(240,67,71,0.15);
  border: 1px solid rgba(240,67,71,0.2);
  color: #ff7b7e;
  width: 24px; height: 24px;
  border-radius: 50%;
  font-size: 0.65rem;
  cursor: pointer;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.15s;
}
.del-btn:hover { background: var(--red); color: white; }
.msg-row:hover .del-btn { display: flex; }

/* Spacer for groups */
.av-spacer {
  width: 34px;
  flex-shrink: 0;
}

/* ── INPUT AREA ── */
.chat-input-area {
  padding: 10px 14px 14px;
  background: var(--bg-1);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.image-preview-bar {
  display: none;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  background: var(--bg-3);
  border-radius: 10px;
  margin-bottom: 8px;
}
.image-preview-bar.show { display: flex; }
.image-preview-bar img {
  width: 48px; height: 48px;
  border-radius: 8px;
  object-fit: cover;
}
.image-preview-bar span {
  flex: 1;
  font-size: 0.8rem;
  color: var(--text-2);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.image-preview-bar button {
  background: none;
  border: none;
  color: var(--text-3);
  cursor: pointer;
  font-size: 1rem;
  padding: 4px;
}
.image-preview-bar button:hover { color: var(--red); }

.chat-input-box {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg-3);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 8px 8px 8px 16px;
  transition: border-color 0.2s;
}
.chat-input-box:focus-within { border-color: rgba(245,166,35,0.3); }
.chat-input-box input {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  color: var(--text-1);
  font-family: var(--font-b);
  font-size: 0.92rem;
}
.chat-input-box input::placeholder { color: var(--text-3); }
.img-attach-label {
  cursor: pointer;
  color: var(--text-3);
  font-size: 1.15rem;
  padding: 6px 8px;
  border-radius: 50%;
  transition: all 0.15s;
  line-height: 1;
}
.img-attach-label:hover { color: var(--accent); background: var(--bg-4); }
.send-btn {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border: none;
  color: white;
  font-size: 1rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: transform 0.15s, box-shadow 0.15s;
}
.send-btn:hover:not(:disabled) { transform: scale(1.08); box-shadow: 0 4px 16px rgba(245,166,35,0.4); }
.send-btn:active { transform: scale(0.94); }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ── AUTH GATE ── */
#auth-gate {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex: 1;
  gap: 16px;
  padding: 40px;
  text-align: center;
}
#auth-gate.show { display: flex; }
#auth-gate h2 { font-family: var(--font-h); font-size: 1.4rem; font-weight: 800; }
#auth-gate p { color: var(--text-2); font-size: 0.9rem; max-width: 320px; }

/* ── BUTTONS ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 22px;
  border-radius: 10px;
  font-family: var(--font-b);
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all 0.2s ease;
  text-decoration: none;
  white-space: nowrap;
}
.btn-primary {
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
  color: white;
  box-shadow: 0 4px 16px rgba(245,166,35,0.3);
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(245,166,35,0.4); }
.btn-ghost {
  background: transparent; color: var(--text-1);
  border: 1px solid var(--border);
}
.btn-ghost:hover { background: var(--bg-3); }
.btn-danger { background: var(--red); color: white; }
.btn-sm { padding: 7px 14px; font-size: 0.8rem; border-radius: 8px; }

/* ── MODAL ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(8px);
  z-index: 1000;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s ease;
  padding: 20px;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  width: 100%; max-width: 400px;
  padding: 32px;
  transform: translateY(20px) scale(0.97);
  transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  position: relative;
  box-shadow: 0 16px 48px rgba(0,0,0,0.6);
}
.modal-overlay.open .modal { transform: translateY(0) scale(1); }
.modal-close {
  position: absolute; top: 14px; right: 14px;
  width: 28px; height: 28px;
  background: var(--bg-3); border: none;
  border-radius: 50%; color: var(--text-2);
  font-size: 0.9rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.modal-close:hover { background: var(--bg-4); color: var(--text-1); }
.modal-icon { font-size: 2.2rem; margin-bottom: 10px; display: block; }
.modal-title { font-family: var(--font-h); font-size: 1.4rem; font-weight: 800; margin-bottom: 4px; }
.modal-sub { font-size: 0.82rem; color: var(--text-2); margin-bottom: 20px; }
.input-group { margin-bottom: 14px; }
.input-group label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--text-2); margin-bottom: 5px; }
.input-field {
  width: 100%;
  background: var(--bg-3); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 11px 14px;
  color: var(--text-1); font-family: var(--font-b); font-size: 0.9rem;
  outline: none; transition: border-color 0.2s;
}
.input-field:focus { border-color: rgba(245,166,35,0.4); }
.input-field::placeholder { color: var(--text-3); }
.error-msg {
  background: rgba(240,67,71,0.1); border: 1px solid rgba(240,67,71,0.2);
  border-radius: 8px; padding: 9px 13px;
  font-size: 0.8rem; color: #ff7b7e;
  margin-bottom: 12px; display: none;
}
.error-msg.show { display: block; }
.modal-divider {
  display: flex; align-items: center; gap: 10px;
  margin: 16px 0; color: var(--text-3); font-size: 0.78rem;
}
.modal-divider::before, .modal-divider::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}

/* ── TOAST ── */
.toast {
  position: fixed; bottom: 20px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--bg-3); border: 1px solid var(--border);
  border-radius: 999px; padding: 10px 24px;
  font-size: 0.85rem; font-weight: 600;
  z-index: 9998; opacity: 0;
  transition: all 0.3s ease; pointer-events: none; white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.success { border-color: rgba(35,197,94,0.3); color: var(--green); }
.toast.error   { border-color: rgba(240,67,71,0.3); color: #ff7b7e; }

/* ── LIGHTBOX ── */
.lightbox {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.92);
  z-index: 2000; display: none;
  align-items: center; justify-content: center;
}
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh; border-radius: 12px; }
.lightbox-close {
  position: absolute; top: 18px; right: 18px;
  background: var(--bg-3); border: none; color: white;
  width: 38px; height: 38px; border-radius: 50%;
  font-size: 1.1rem; cursor: pointer;
}

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg-4); border-radius: 5px; }

/* ── MUSIC BAR ── */
.music-bar {
  display: none;
  align-items: center;
  gap: 12px;
  padding: 8px 16px;
  background: rgba(19,21,26,0.95);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.music-bar.show { display: flex; }
.music-icon { font-size: 1.1rem; color: var(--accent); animation: spin 4s linear infinite; }
.music-icon.paused { animation-play-state: paused; }
@keyframes spin { to { transform: rotate(360deg); } }
.music-info { flex: 1; }
.music-title { font-size: 0.78rem; font-weight: 600; }
.music-sub { font-size: 0.68rem; color: var(--text-3); }
.music-btn {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--bg-3); border: none;
  color: var(--text-1); font-size: 0.85rem;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.music-btn:hover { background: var(--bg-4); color: var(--accent); }
.vol-slider {
  -webkit-appearance: none; width: 64px; height: 3px;
  border-radius: 3px; background: var(--bg-4); outline: none; cursor: pointer;
}
.vol-slider::-webkit-slider-thumb {
  -webkit-appearance: none; width: 11px; height: 11px;
  border-radius: 50%; background: var(--accent);
}

/* ── GRAIN ── */
body::after {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
  opacity: 0.02; pointer-events: none; z-index: 9999;
}

/* ── DECONNECT BTN ── */
.logout-btn {
  background: rgba(240,67,71,0.1);
  border: 1px solid rgba(240,67,71,0.15);
  color: #ff7b7e;
  border-radius: 8px;
  padding: 6px 14px;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
}
.logout-btn:hover { background: rgba(240,67,71,0.2); }

@media (max-width: 600px) {
  .chat-topbar { padding: 12px 14px; }
  .chat-input-area { padding: 8px 10px 12px; }
}
</style>
</head>
<body>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="document.getElementById('lightbox').classList.remove('open')">
  <img src="" id="lightbox-img" alt=""/>
  <button class="lightbox-close" onclick="event.stopPropagation();document.getElementById('lightbox').classList.remove('open')">✕</button>
</div>

<!-- TOP BAR -->
<div class="chat-topbar">
  <a class="chat-topbar-brand" href="index.html">
    <span>☠️</span>Mugiwara No ZK
  </a>
  <div class="topbar-right">
    <div class="online-badge">
      <div class="status-dot"></div>
      <span id="online-count">Chat en direct</span>
    </div>
    <span id="topbar-pseudo"></span>
    <button class="logout-btn" id="logout-btn" style="display:none" onclick="doLogout()">Déconnexion</button>
  </div>
</div>

<!-- AUTH GATE -->
<div id="auth-gate">
  <span style="font-size:3rem">🔐</span>
  <h2>Accès réservé aux membres</h2>
  <p>Connecte-toi pour accéder au chat du crew Mugiwara.</p>
  <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">
    <button class="btn btn-primary" onclick="openModal('login')">🔑 Connexion</button>
    <button class="btn btn-ghost" onclick="openModal('register')">⚓ S'inscrire</button>
  </div>
</div>

<!-- CHAT BODY -->
<div class="chat-body" id="chat-body" style="display:none"></div>

<!-- IMAGE PREVIEW -->
<div class="chat-input-area" id="input-area" style="display:none">
  <div class="image-preview-bar" id="img-preview-bar">
    <img src="" id="img-preview-thumb" alt=""/>
    <span id="img-preview-name"></span>
    <button onclick="cancelImg()">✕</button>
  </div>
  <div class="chat-input-box">
    <label class="img-attach-label" for="img-file-input" title="Joindre une image">🖼️</label>
    <input type="file" id="img-file-input" accept="image/*" style="display:none" onchange="handleImgSelect(this)"/>
    <input type="text" id="msg-input" placeholder="Écris un message…" maxlength="500" autocomplete="off"/>
    <button class="send-btn" id="send-btn" onclick="sendMsg()">➤</button>
  </div>
</div>

<!-- MUSIC BAR -->
<div class="music-bar" id="music-bar">
  <span class="music-icon" id="music-icon">♪</span>
  <div class="music-info">
    <div class="music-title" id="music-title">MZK Radio</div>
    <div class="music-sub">En direct</div>
  </div>
  <button class="music-btn" id="play-btn" onclick="toggleMusic()">▶</button>
  <input type="range" class="vol-slider" min="0" max="100" value="60" oninput="setVol(this.value)"/>
</div>
<audio id="bg-audio" preload="none"></audio>

<!-- ═══ MODAL LOGIN ═══ -->
<div class="modal-overlay" id="modal-login">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('login')">✕</button>
    <span class="modal-icon">🔑</span>
    <div class="modal-title">Connexion</div>
    <div class="modal-sub">Content de te revoir !</div>
    <div class="error-msg" id="login-err"></div>
    <div class="input-group"><label>Email</label><input class="input-field" id="login-email" type="email" placeholder="ton@email.com"/></div>
    <div class="input-group"><label>Mot de passe</label><input class="input-field" id="login-pass" type="password" placeholder="••••••••"/></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="doLogin()">Se connecter</button>
    <div class="modal-divider">ou</div>
    <button class="btn btn-ghost" style="width:100%;justify-content:center" onclick="closeModal('login');openModal('register')">⚓ Créer un compte</button>
  </div>
</div>

<!-- ═══ MODAL REGISTER ═══ -->
<div class="modal-overlay" id="modal-register">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('register')">✕</button>
    <span class="modal-icon">⚓</span>
    <div class="modal-title">Créer un compte</div>
    <div class="modal-sub">Rejoins le crew !</div>
    <div class="error-msg" id="reg-err"></div>
    <div class="input-group"><label>Pseudo (tag Brawl Stars)</label><input class="input-field" id="reg-pseudo" placeholder="ton pseudo"/></div>
    <div class="input-group"><label>Email</label><input class="input-field" id="reg-email" type="email" placeholder="ton@email.com"/></div>
    <div class="input-group"><label>Mot de passe</label><input class="input-field" id="reg-pass" type="password" placeholder="••••••••"/></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="doRegister()">Créer le compte</button>
    <div class="modal-divider">Déjà un compte ?</div>
    <button class="btn btn-ghost" style="width:100%;justify-content:center" onclick="closeModal('register');openModal('login')">🔑 Se connecter</button>
  </div>
</div>

<script>
/* ═══════════════
   STATE
═══════════════ */
let me = null;
let myPseudo = '';
let isAdmin = false;
let pendingImg = null; // { dataUrl, name }
let chatUnsub = null;
let musicPlaying = false;

/* ═══════════════
   TOAST
═══════════════ */
function toast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(() => t.className = 'toast', 3000);
}

/* ═══════════════
   MODAL
═══════════════ */
function openModal(id) { document.getElementById('modal-'+id).classList.add('open'); }
function closeModal(id) {
  document.getElementById('modal-'+id).classList.remove('open');
  document.querySelectorAll('#modal-'+id+' .error-msg').forEach(e => e.classList.remove('show'));
}
document.querySelectorAll('.modal-overlay').forEach(o => {
  o.addEventListener('click', e => { if (e.target === o) o.classList.remove('open'); });
});

/* ═══════════════
   AUTH
═══════════════ */
async function doLogin() {
  const { auth } = window._fb;
  const { signInWithEmailAndPassword } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js");
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-pass').value;
  const err   = document.getElementById('login-err');
  err.classList.remove('show');
  try {
    await signInWithEmailAndPassword(auth, email, pass);
    closeModal('login');
    toast('Bienvenue 🏴‍☠️');
  } catch(e) {
    err.textContent = 'Email ou mot de passe incorrect.';
    err.classList.add('show');
  }
}

async function doRegister() {
  const { auth, db, ref } = window._fb;
  const { createUserWithEmailAndPassword } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js");
  const { set } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js");
  const pseudo = document.getElementById('reg-pseudo').value.trim();
  const email  = document.getElementById('reg-email').value.trim();
  const pass   = document.getElementById('reg-pass').value;
  const err    = document.getElementById('reg-err');
  err.classList.remove('show');
  if (!pseudo) { err.textContent = 'Pseudo requis.'; err.classList.add('show'); return; }
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await set(ref(db, 'users/'+cred.user.uid), { pseudo, email, createdAt: new Date().toISOString() });
    closeModal('register');
    toast('Bienvenue '+pseudo+' 🎉');
  } catch(e) {
    err.textContent = e.code === 'auth/email-already-in-use' ? 'Ce compte existe déjà.' : 'Erreur : '+e.message;
    err.classList.add('show');
  }
}

function doLogout() {
  const { auth, signOut } = window._fb;
  signOut(auth).catch(()=>{});
  me = null; myPseudo = ''; isAdmin = false;
  showAuthGate();
  toast('Déconnecté 👋');
}

/* ═══════════════
   UI STATES
═══════════════ */
function showChat() {
  document.getElementById('auth-gate').classList.remove('show');
  document.getElementById('auth-gate').style.display = 'none';
  document.getElementById('chat-body').style.display = 'flex';
  document.getElementById('input-area').style.display = 'block';
  document.getElementById('logout-btn').style.display = 'inline-block';
  document.getElementById('topbar-pseudo').textContent = myPseudo;
}
function showAuthGate() {
  document.getElementById('auth-gate').style.display = 'flex';
  document.getElementById('chat-body').style.display = 'none';
  document.getElementById('input-area').style.display = 'none';
  document.getElementById('logout-btn').style.display = 'none';
  document.getElementById('topbar-pseudo').textContent = '';
}

/* ═══════════════
   FIREBASE AUTH STATE
═══════════════ */
window.addEventListener('load', () => {
  const { auth, db, ref, get, onAuthStateChanged, onValue } = window._fb;

  onAuthStateChanged(auth, async user => {
    me = user;
    if (user) {
      // Récupère pseudo
      try {
        const snap = await get(ref(db, 'users/'+user.uid));
        myPseudo = snap.exists() ? (snap.val().pseudo || user.email) : user.email;
      } catch(e) { myPseudo = user.email; }
      showChat();
      startChat();
    } else {
      showAuthGate();
      if (chatUnsub) { chatUnsub(); chatUnsub = null; }
    }
  });

  // Music
  onValue(ref(db, 'settings/music'), snap => {
    const url = snap.exists() ? snap.val() : null;
    const audio = document.getElementById('bg-audio');
    const bar   = document.getElementById('music-bar');
    const title = document.getElementById('music-title');
    if (url) {
      audio.src = url;
      audio.volume = 0.6;
      bar.classList.add('show');
      title.textContent = url.split('/').pop().replace(/\.[^.]+$/,'') || 'MZK Radio';
    } else {
      bar.classList.remove('show');
      audio.src = ''; audio.pause(); musicPlaying = false;
      document.getElementById('play-btn').textContent = '▶';
      document.getElementById('music-icon').style.animationPlayState = 'paused';
    }
  });
});

/* ═══════════════
   CHAT
═══════════════ */
let badWords = [];
window._fb.onValue(window._fb.ref(window._fb.db, 'settings/badwords'), snap => {
  badWords = snap.exists() ? (snap.val() || []) : [];
});

function filterBadWords(txt) {
  let out = txt;
  badWords.forEach(w => {
    const re = new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
    out = out.replace(re, m => '*'.repeat(m.length));
  });
  return out;
}

function startChat() {
  const { db, ref, onValue } = window._fb;
  if (chatUnsub) chatUnsub();

  chatUnsub = onValue(ref(db, 'chat'), snap => {
    const body = document.getElementById('chat-body');
    const wasAtBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 80;
    body.innerHTML = '';

    if (!snap.exists()) return;
    const data = snap.val();
    const keys = Object.keys(data).sort((a,b) => data[a].ts - data[b].ts);

    let lastUid = null, lastTs = 0, lastDate = '';

    keys.forEach(key => {
      const m = data[key];
      const isOwn = me && m.uid === me.uid;
      const msgDate = new Date(m.ts).toLocaleDateString('fr-FR', { day:'numeric', month:'long' });
      const newGroup = m.uid !== lastUid || (m.ts - lastTs) > 5 * 60 * 1000;

      // Date separator
      if (msgDate !== lastDate) {
        const sep = document.createElement('div');
        sep.className = 'date-sep';
        sep.textContent = msgDate;
        body.appendChild(sep);
        lastDate = msgDate;
      }

      if (newGroup) {
        const g = document.createElement('div');
        g.className = 'msg-group' + (isOwn ? ' msg-own' : '');

        const header = document.createElement('div');
        header.className = 'msg-header';
        const time = new Date(m.ts);
        header.innerHTML = `
          <span class="msg-author${m.isAdmin ? ' is-admin' : ''}">${isOwn ? 'Vous' : escHtml(m.pseudo||'?')}</span>
          <span class="msg-time">${String(time.getHours()).padStart(2,'0')}:${String(time.getMinutes()).padStart(2,'0')}</span>
        `;
        g.appendChild(header);
        g.appendChild(makeRow(key, m, isOwn));
        body.appendChild(g);
      } else {
        const lastGroup = body.lastElementChild;
        lastGroup.appendChild(makeRow(key, m, isOwn));
      }

      lastUid = m.uid; lastTs = m.ts;
    });

    if (wasAtBottom) body.scrollTop = body.scrollHeight;
  });
}

function makeRow(key, m, isOwn) {
  const row = document.createElement('div');
  row.className = 'msg-row';

  if (!isOwn) {
    const av = document.createElement('div');
    av.className = 'msg-avatar' + (m.isAdmin ? ' admin-av' : '');
    av.textContent = (m.pseudo||'?')[0].toUpperCase();
    row.appendChild(av);
  }

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';

  if (m.img) {
    const img = document.createElement('img');
    img.className = 'msg-img';
    img.src = m.img;
    img.loading = 'lazy';
    img.onclick = () => {
      document.getElementById('lightbox-img').src = m.img;
      document.getElementById('lightbox').classList.add('open');
    };
    bubble.appendChild(img);
  } else {
    bubble.textContent = m.text || '';
  }

  row.appendChild(bubble);

  // Seul l'admin peut supprimer
  if (isAdmin) {
    const del = document.createElement('button');
    del.className = 'del-btn';
    del.innerHTML = '✕';
    del.onclick = () => deleteMsg(key);
    row.appendChild(del);
  }

  return row;
}

async function sendMsg() {
  if (!me) { openModal('login'); return; }
  const { db, ref, push } = window._fb;
  const input = document.getElementById('msg-input');
  const text = input.value.trim();

  if (!text && !pendingImg) return;

  const payload = {
    uid: me.uid,
    pseudo: myPseudo,
    ts: Date.now()
  };
  if (isAdmin) payload.isAdmin = true;

  if (pendingImg) {
    // Vérifie taille (max 800KB base64 ≈ 600KB fichier)
    if (pendingImg.dataUrl.length > 900000) {
      toast('Image trop lourde (max ~600KB) 📦', 'error');
      return;
    }
    payload.img = pendingImg.dataUrl;
    cancelImg();
  } else {
    payload.text = filterBadWords(text);
    input.value = '';
  }

  try {
    await push(ref(db, 'chat'), payload);
    const body = document.getElementById('chat-body');
    setTimeout(() => body.scrollTop = body.scrollHeight, 100);
  } catch(e) {
    toast('Erreur envoi 😕', 'error');
  }
}

async function deleteMsg(key) {
  const { db, ref, remove } = window._fb;
  try { await remove(ref(db, 'chat/'+key)); } catch(e) {}
}

document.getElementById('msg-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
});

/* ═══════════════
   IMAGE ATTACH
═══════════════ */
function handleImgSelect(input) {
  const file = input.files[0];
  if (!file) return;

  // Vérifie le type
  if (!file.type.startsWith('image/')) {
    toast('Fichier non supporté, envoie une image 🖼️', 'error');
    input.value = ''; return;
  }
  // Vérifie la taille (max 800KB)
  if (file.size > 800 * 1024) {
    toast('Image trop lourde (max 800KB) 📦', 'error');
    input.value = ''; return;
  }

  const reader = new FileReader();
  reader.onload = e => {
    pendingImg = { dataUrl: e.target.result, name: file.name };
    document.getElementById('img-preview-thumb').src = e.target.result;
    document.getElementById('img-preview-name').textContent = file.name;
    document.getElementById('img-preview-bar').classList.add('show');
  };
  reader.readAsDataURL(file);
  input.value = '';
}

function cancelImg() {
  pendingImg = null;
  document.getElementById('img-preview-bar').classList.remove('show');
  document.getElementById('img-preview-thumb').src = '';
}

/* ═══════════════
   MUSIC
═══════════════ */
function toggleMusic() {
  const audio = document.getElementById('bg-audio');
  const btn = document.getElementById('play-btn');
  const icon = document.getElementById('music-icon');
  if (musicPlaying) {
    audio.pause();
    btn.textContent = '▶';
    icon.style.animationPlayState = 'paused';
    musicPlaying = false;
  } else {
    audio.play().catch(() => toast('Clique d\'abord sur la page pour activer le son 🔊'));
    btn.textContent = '⏸';
    icon.style.animationPlayState = 'running';
    musicPlaying = true;
  }
}
function setVol(v) { document.getElementById('bg-audio').volume = v / 100; }

/* ═══════════════
   UTILS
═══════════════ */
function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
